<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* Alterando a cor principal do Bootstrap para um tom de verde */
            --bs-primary: #198754; 
            --bs-primary-rgb: 25, 135, 84;
            --bs-body-bg: #121212; /* Fundo um pouco mais escuro e confortável */
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-primary:hover {
            background-color: #157347;
            border-color: #146c43;
        }
        .text-primary {
            color: var(--bs-primary) !important;
        }
        .card {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-success">
        <div class="container d-flex justify-content-between">
            <a class="navbar-brand text-primary fw-bold" href="{% url 'lista_eventos' %}">Portal de Eventos</a>
            
<div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-light me-3 small d-none d-md-inline">Olá, {{ user.username }}</span>
                    
                    <div class="dropdown me-3">
                        <button class="btn btn-outline-success btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Acesso Rápido
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark border-success">
                            <li><a class="dropdown-item" href="{% url 'painel_dashboard' %}">Painel de Eventos</a></li>
                            <li><a class="dropdown-item" href="{% url 'novo_evento' %}">Criar Novo Evento</a></li>
                        </ul>
                    </div>
                    
                    <form method="POST" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Sair</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">Acesso Equipe</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
